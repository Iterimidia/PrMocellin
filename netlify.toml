[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Imagens, ícones e estilos: cache de 7 dias no navegador
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# A prévia /novo/ virou a home oficial
[[redirects]]
  from = "/novo/*"
  to = "/"
  status = 301

# Arquivos internos não ficam públicos
[[redirects]]
  from = "/ferramentas/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/PENDENCIAS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# Endereço oficial: prmocellin.com (o .netlify.app redireciona para ele)
[[redirects]]
  from = "https://prmocellin.netlify.app/*"
  to = "https://prmocellin.com/:splat"
  status = 301
  force = true
